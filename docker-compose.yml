services:
    nginx:
        image: nginx:alpine
        container_name: "anbar-nginx"
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ./:/usr/share/nginx/www
            - ./docs/dockerfiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        extra_hosts:
            - "anbaritoys.ir:0.0.0.0"
            - "localhost:0.0.0.0"
        restart: unless-stopped
        depends_on:
            - php
            - admin-php

    php:
        container_name: "anbar-php"
        build:
            context: .
            dockerfile: docs/dockerfiles/Dockerfile
        hostname: anbar
        extra_hosts:
            - "anbaritoys.ir:127.0.0.1"
            - "localhost:127.0.0.1"
        volumes:
            - ./:/usr/share/nginx/www
        restart: unless-stopped

    # Admin panel gets its own php-fpm so its core.php bootstrap (and its
    # login guard) can never leak into main-site requests, and vice versa.
    admin-php:
        container_name: "anbar-admin-php"
        image: anbar-php
        hostname: anbar-admin
        depends_on:
            - php
        extra_hosts:
            - "anbaritoys.ir:127.0.0.1"
            - "localhost:127.0.0.1"
        volumes:
            - ./:/usr/share/nginx/www
            - ./docs/dockerfiles/anbar-admin.ini:/usr/local/etc/php/conf.d/anbar.ini:ro
        restart: unless-stopped

networks:
    default:
        external: true
        name: "${APP_DOCKER_NETWORK:-app}"

server {
    listen 80 default_server; # listen for requests on port 80 (HTTP)
    listen [::]:80 default_server; # listen for requests on IPv6

    # Root of the main site (anbaritoys)
    root /usr/share/nginx/www;

    index index.php index.html index.htm;

    # ------------------------------------------------------------------
    # Deny access to hidden files (.htaccess, .env, ...) for the main site
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
    }

    # ------------------------------------------------------------------
    # photos.anbaritoys.ir  ->  /photos
    # Static product/category/brand/blog images.
    # ------------------------------------------------------------------
    location ^~ /photos/ {
        alias /usr/share/nginx/www/photos.anbaritoys.ir/;
        index index.php index.html;

        try_files $uri $uri/ =404;

        # this subdomain is static-only locally; never expose PHP source
        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }

    # ------------------------------------------------------------------
    # public.anbaritoys.ir  ->  /public
    # Mostly a redirect stub; served as static only.
    # ------------------------------------------------------------------
    location ^~ /public/ {
        alias /usr/share/nginx/www/public.anbaritoys.ir/;
        index index.php index.html;

        try_files $uri $uri/ =404;

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }

    # ------------------------------------------------------------------
    # admin.anbaritoys.ir  ->  /admin
    # Full PHP admin panel with its own bootstrap (core.php).
    # ------------------------------------------------------------------
    location ^~ /admin/ {
        alias /usr/share/nginx/www/admin.anbaritoys.ir/;
        index index.php index.html;

        try_files $uri $uri/ =404;

        location ~ /\. {
            deny all;
        }

        location ~ ^/admin/(.+\.php)$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/share/nginx/www/admin.anbaritoys.ir/$1;
            # The admin app has its own core.php and resolves its includes
            # relative to the admin folder, so override auto_prepend_file
            # and put the admin folder first in the include_path.
            fastcgi_param PHP_VALUE "auto_prepend_file=/usr/share/nginx/www/admin.anbaritoys.ir/core.php\ninclude_path=/usr/share/nginx/www/admin.anbaritoys.ir:/usr/share/nginx/www:.:/usr/local/lib/php";
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_pass anbar-php:9000;
        }
    }

    # ------------------------------------------------------------------
    # Main site (anbaritoys) -> /
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass anbar-php:9000; # pass requests to PHP-FPM on port 9000
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # set the filename parameter for the FastCGI request
        include fastcgi_params; # include FastCGI parameters
        fastcgi_split_path_info ^(.+\.php)(/.+)$; # split the path info for FastCGI requests
        fastcgi_intercept_errors on; # intercept and process errors
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Enable Gzip compression for text-based files
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 200M;
}

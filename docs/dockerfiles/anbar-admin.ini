; Admin panel (admin.anbaritoys.ir) runs in its own php-fpm container
; (service admin-php) and bootstraps the admin core.php on every request.
; This file is mounted over conf.d/anbar.ini so it fully replaces the
; main-site prepend configuration inside the admin container.
auto_prepend_file=/usr/share/nginx/www/admin.anbaritoys.ir/core.php
include_path="/usr/share/nginx/www/admin.anbaritoys.ir:/usr/share/nginx/www:.:/usr/local/lib/php"
